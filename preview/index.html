<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>car-info-card preview</title>
<style>
  body { margin: 0; padding: 24px; font-family: Roboto, "Noto Sans", Arial, sans-serif;
    background: var(--primary-background-color); }
  body.light { --divider-color:#e0e0e0; --primary-color:#03a9f4; --primary-background-color:#fafafa;
    --card-background-color:#fff; --primary-text-color:#212121; --secondary-text-color:#727272; }
  body.dark { --divider-color:#333; --primary-color:#03a9f4; --primary-background-color:#111111;
    --card-background-color:#1c1c1c; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; }
  #wrap { width: var(--w, 560px); }
  #wrap.editor { width: 1044px; display: grid; grid-template-columns: 560px 460px; gap: 24px; align-items: start; }
  #wrap.gallery { width: 1044px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  #editor-box { background: var(--card-background-color); border-radius: 12px; padding: 16px;
    border: 1px solid rgba(127,127,127,.25); color: var(--primary-text-color); }
  #yaml { font: 12px/1.4 monospace; white-space: pre-wrap; color: var(--secondary-text-color); margin-top: 16px; }
</style>
</head>
<body class="light">
<div id="wrap"></div>
<script type="module">
  import * as mdi from "/node_modules/@mdi/js/mdi.js";

  // Stand-ins for Home Assistant's own elements, for the preview only
  const iconPath = (name) => {
    if (!name) return "";
    const key = "mdi" + name.replace("mdi:", "").split("-")
      .map((p) => p[0].toUpperCase() + p.slice(1)).join("");
    return mdi[key] || "";
  };
  class StubIcon extends HTMLElement {
    set icon(v) { this._icon = v; this._r(); }
    set stateObj(v) { this._icon = v?.attributes?.icon; this._r(); }
    set hass(_) {}
    _r() {
      this.style.display = "inline-flex";
      this.innerHTML = `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="${iconPath(this._icon)}"/></svg>`;
    }
  }
  customElements.define("ha-icon", StubIcon);
  customElements.define("ha-state-icon", class extends StubIcon {});
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML = `<style>:host{display:block;
        background:var(--card-background-color);border-radius:12px;
        border:1px solid rgba(127,127,127,.25)}</style><slot></slot>`;
    }
  });

  await import("/preview/ha-form-stub.js");
  await import("/dist/car-info-card.js");

  const P = "sensor.my_car_";
  // Preview texts for enum states (Home Assistant uses the integration's translations)
  const ENUM = {
    charging: "Charging", connect_cable: "Connect cable", ready_for_charging: "Ready for charging",
    conserving: "Conserving", discharging: "Discharging", charging_interrupted: "Charging interrupted",
    not_charging: "Not charging", ac: "AC", dc: "DC",
  };
  const nf = (v, d) => Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });

  // Example values
  const SCENARIOS = {
    unplugged: { odometer: "15840", battery_level: "35", range: "130.0",
      charging_power: "0.0", charging_state: "connect_cable", time_to_full: "unknown",
      charging_type: "not_charging", target_temperature: "21.0", climate_time_left: "unknown" },
    charging_ac: { odometer: "15840", battery_level: "62", range: "231.0",
      charging_power: "10.8", charging_state: "charging", time_to_full: "155",
      charging_type: "ac", target_temperature: "21.0", climate_time_left: "unknown" },
    charging_dc: { odometer: "15840", battery_level: "71", range: "265.0",
      charging_power: "85.0", charging_state: "charging", time_to_full: "18",
      charging_type: "dc", target_temperature: "21.0", climate_time_left: "unknown" },
    nearly_full: { odometer: "15840", battery_level: "85", range: "312.0",
      charging_power: "7.2", charging_state: "charging", time_to_full: "25",
      charging_type: "ac", target_temperature: "21.0", climate_time_left: "unknown" },
    full: { odometer: "15840", battery_level: "100", range: "368.0",
      charging_power: "0.0", charging_state: "conserving", time_to_full: "0",
      charging_type: "not_charging", target_temperature: "21.0", climate_time_left: "unknown" },
    slow: { odometer: "15840", battery_level: "14", range: "52.0",
      charging_power: "2.3", charging_state: "charging", time_to_full: "920",
      charging_type: "ac", target_temperature: "21.0", climate_time_left: "unknown" },
  };
  // name, unit, icon, decimals
  const META = {
    odometer: ["Odometer", "km", "mdi:counter", 0],
    battery_level: ["Battery level", "%", "mdi:battery", 0],
    range: ["Range", "km", "mdi:map-marker-distance", 0],
    charging_power: ["Charging power", "kW", "mdi:flash", 1],
    charging_state: ["Charging state", null, "mdi:ev-station"],
    // ⚠️ The unit differs between integrations; minutes assumed here
    time_to_full: ["Time to full", "min", "mdi:timer-outline", 0],
    charging_type: ["Charging type", null, "mdi:ev-plug-type2"],
    target_temperature: ["Target temperature", "°C", "mdi:thermometer", 1],
    climate_time_left: ["Climate time left", "min", "mdi:fan", 0],
  };
  const CHARGING_OPTIONS = ["charging", "connect_cable", "ready_for_charging",
    "conserving", "discharging", "charging_interrupted"];

  function makeHass(values, language = "en") {
    const states = {};
    for (const [k, v] of Object.entries(values)) {
      const [name, unit, icon] = META[k];
      states[P + k] = { entity_id: P + k, state: v,
        attributes: { friendly_name: "My car " + name, icon,
          ...(k === "charging_state" ? { device_class: "enum", options: CHARGING_OPTIONS } : {}),
          ...(unit ? { unit_of_measurement: unit } : {}) } };
    }
    states[P + "licence_plate"] = { entity_id: P + "licence_plate", state: "AB-CD 123",
      attributes: { friendly_name: "My car Licence plate" } };
    // Other devices, so the device filter in the editor has something to hide
    states["sensor.wallbox_power"] = { entity_id: "sensor.wallbox_power", state: "0.0",
      attributes: { friendly_name: "Wallbox Power", unit_of_measurement: "kW", icon: "mdi:ev-station" } };
    states["sensor.outdoor_temperature"] = { entity_id: "sensor.outdoor_temperature", state: "8.5",
      attributes: { friendly_name: "Outdoor temperature", unit_of_measurement: "°C", icon: "mdi:thermometer" } };
    const devices = {
      dev_car: { id: "dev_car", name: "My car" },
      dev_wallbox: { id: "dev_wallbox", name: "Wallbox" },
    };
    const entities = {};
    for (const id of Object.keys(states)) {
      const device_id = id.startsWith(P) ? "dev_car" : id.startsWith("sensor.wallbox") ? "dev_wallbox" : null;
      entities[id] = { entity_id: id, device_id };
    }
    return {
      states,
      devices,
      entities,
      language,
      locale: { language },
      formatEntityState(s) {
        const key = s.entity_id.replace(P, "");
        const meta = META[key];
        if (!meta) {
          const unit = s.attributes.unit_of_measurement;
          return unit ? `${s.state} ${unit}` : s.state;
        }
        const [, unit, , digits] = meta;
        if (!unit) return ENUM[s.state] ?? s.state;
        return `${nf(s.state, digits)} ${unit}`;
      },
    };
  }

  function baseConfig() {
    return {
      name: "My car",
      device: "dev_car",
      entities: {
        battery: P + "battery_level",
        charging_power: P + "charging_power",
        charging_state: P + "charging_state",
        plate: P + "licence_plate",
      },
      values: [
        { entity: P + "odometer", name: "Odometer" },
        { entity: P + "range", name: "Range" },
        { entity: P + "target_temperature", name: "Climate" },
        { entity: P + "charging_power", name: "Power" },
        { entity: P + "time_to_full", name: "Time to full" },
        { entity: P + "charging_type", name: "Type" },
      ],
    };
  }

  window.render = ({ scenario, theme, width, config }) => {
    document.body.className = theme;
    const wrap = document.getElementById("wrap");
    wrap.className = "";
    wrap.style.setProperty("--w", width + "px");
    const card = document.createElement("car-info-card");
    card.setConfig({ ...baseConfig(), ...(config || {}) });
    card.hass = makeHass(SCENARIOS[scenario]);
    wrap.replaceChildren(card);
    return card.updateComplete;
  };

  // Editor next to the card; config-changed is fed back like Home Assistant does
  window.renderEditor = async ({ scenario, theme, config, language }) => {
    document.body.className = theme;
    const wrap = document.getElementById("wrap");
    wrap.className = "editor";
    wrap.style.removeProperty("--w");
    const hass = makeHass(SCENARIOS[scenario], language);
    const card = document.createElement("car-info-card");
    const editor = document.createElement("car-info-card-editor");
    const box = document.createElement("div");
    box.id = "editor-box";
    const yaml = document.createElement("div");
    yaml.id = "yaml";
    box.append(editor, yaml);
    const apply = (cfg) => {
      window.lastConfig = cfg;
      card.setConfig(cfg);
      editor.setConfig(cfg);
      yaml.textContent = JSON.stringify(cfg, null, 2);
    };
    card.hass = hass;
    editor.hass = hass;
    apply(config || baseConfig());
    editor.addEventListener("config-changed", (ev) => apply(ev.detail.config));
    const col = document.createElement("div");
    col.append(card);
    wrap.replaceChildren(col, box);
    await editor.updateComplete;
    await card.updateComplete;
  };

  // All built-in vehicle drawings side by side
  window.renderGallery = async ({ theme, scenario = "charging_ac", names }) => {
    document.body.className = theme;
    const wrap = document.getElementById("wrap");
    wrap.className = "gallery";
    wrap.style.removeProperty("--w");
    const cards = names.map((name) => {
      const card = document.createElement("car-info-card");
      card.setConfig({ ...baseConfig(), name, values: [], show_plate: false, silhouette: name });
      card.hass = makeHass(SCENARIOS[scenario]);
      return card;
    });
    wrap.replaceChildren(...cards);
    await Promise.all(cards.map((c) => c.updateComplete));
  };

  window.ready = true;
</script>
</body>
</html>
